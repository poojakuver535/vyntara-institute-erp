<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notices - Vyntara ERP</title><link rel="stylesheet" href="../css/erp.css"></head>
<body>
<aside class="sidebar">
  <h2>Vyntara <span>ERP</span></h2>
  <ul>
    <li><a href="dashboard.html">📊 <span>Dashboard</span></a></li>
    <li><a href="students.html">👨‍🎓 <span>Students</span></a></li>
    <li><a href="faculty.html">👩‍🏫 <span>Faculty</span></a></li>
    <li><a href="courses.html">📚 <span>Courses</span></a></li>
    <li><a href="attendance.html">✅ <span>Attendance</span></a></li>
    <li><a href="notices.html" class="active">📢 <span>Notices</span></a></li>
    <li><a href="#" onclick="logout()">🚪 <span>Logout</span></a></li>
  </ul>
</aside>
<main class="main">
  <div class="topbar">
    <h1>Notice Board</h1>
    <div class="user-info"><div class="avatar">A</div><strong id="user-name">ADMIN</strong><button class="logout-btn" onclick="logout()">Logout</button></div>
  </div>
  <div class="panel">
    <h2>Post New Notice</h2>
    <form id="notice-form" onsubmit="return addNotice(event)">
      <div class="form-row">
        <div class="form-group"><label>Title *</label><input id="n-title" required></div>
        <div class="form-group"><label>Date *</label><input type="date" id="n-date" required></div>
      </div>
      <div class="form-group"><label>Content *</label><textarea id="n-content" rows="4" required></textarea></div>
      <button class="btn-primary" type="submit">📢 Publish Notice</button>
    </form>
  </div>
  <div class="panel">
    <h2>All Notices</h2>
    <table id="notices-table">
      <thead><tr><th>Date</th><th>Title</th><th>Content</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<script src="../js/erp.js"></script>
<script>if(!requireAuth()){} </script>
</body></html>
