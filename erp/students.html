<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students - Vyntara ERP</title><link rel="stylesheet" href="../css/erp.css"></head>
<body>
<aside class="sidebar">
  <h2>Vyntara <span>ERP</span></h2>
  <ul>
    <li><a href="dashboard.html">📊 <span>Dashboard</span></a></li>
    <li><a href="students.html" class="active">👨‍🎓 <span>Students</span></a></li>
    <li><a href="faculty.html">👩‍🏫 <span>Faculty</span></a></li>
    <li><a href="courses.html">📚 <span>Courses</span></a></li>
    <li><a href="attendance.html">✅ <span>Attendance</span></a></li>
    <li><a href="notices.html">📢 <span>Notices</span></a></li>
    <li><a href="#" onclick="logout()">🚪 <span>Logout</span></a></li>
  </ul>
</aside>
<main class="main">
  <div class="topbar">
    <h1>Student Management</h1>
    <div class="user-info"><div class="avatar">A</div><strong id="user-name">ADMIN</strong><button class="logout-btn" onclick="logout()">Logout</button></div>
  </div>
  <div class="panel">
    <h2>Add / Edit Student</h2>
    <form id="student-form" onsubmit="return addStudent(event)">
      <input type="hidden" id="s-edit-id">
      <div class="form-row">
        <div class="form-group"><label>Name *</label><input id="s-name" required></div>
        <div class="form-group"><label>Roll Number *</label><input id="s-roll" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Course *</label>
          <select id="s-course" required>
            <option value="">-- Select --</option>
            <option>B.Tech CSE</option><option>B.Tech ECE</option><option>B.Tech ME</option>
            <option>BBA</option><option>MBA</option><option>BCA</option>
          </select>
        </div>
        <div class="form-group"><label>Year *</label>
          <select id="s-year" required><option value="">--</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Email *</label><input type="email" id="s-email" required></div>
        <div class="form-group"><label>Phone</label><input id="s-phone"></div>
      </div>
      <button class="btn-primary" type="submit">Save Student</button>
    </form>
  </div>
  <div class="panel">
    <h2>All Students</h2>
    <table id="students-table">
      <thead><tr><th>ID</th><th>Roll</th><th>Name</th><th>Course</th><th>Year</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<script src="../js/erp.js"></script>
<script>if(!requireAuth()){} </script>
</body></html>
